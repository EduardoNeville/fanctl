[project]
name = "fanctl"
version = "0.1.0"
description = "Temperature-driven 4-wire fan control: an ESP32-C3 PWM/tach bridge over USB serial, and a host-side curve"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fanctl = "fanctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["fanctl"]
