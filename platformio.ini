; Detected board: ESP32-C3 (QFN32) rev v0.4, 4 MB embedded flash, native
; USB-Serial/JTAG at /dev/ttyACM0 (VID:PID 303a:1001) — no CP2102/CH340 on this board.
;
; C3 pin rules:
;   GPIO 25/26 do not exist on this chip, and GPIO 18/19 are USB D-/D+ (using
;   them kills the serial link). GND/5V/3V3 are not GPIOs. GPIO 2/8/9 are
;   strapping pins; 8/9 also carry the LED and BOOT button.
;   -> PWM = GPIO 4, TACH = GPIO 5. Change these two flags if you wired
;      somewhere else; nothing in src/main.cpp is pin-specific.
[env:esp32-c3-devkitm-1]
platform = espressif32 @ ^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
  -DPIN_PWM=4
  -DPIN_TACH=5
  -DARDUINO_USB_MODE=1          ; use the hardware USB-Serial-JTAG, not TinyUSB
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB CDC; without this it prints to UART0
